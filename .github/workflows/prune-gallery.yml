name: Prune Gallery (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would be removed, don't delete)"
        type: boolean
        default: true

concurrency:
  group: gallery-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service-account file
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_FILE }}
        run: printf '%s' "$GDRIVE_SA_JSON" > /tmp/sa.json

      - name: Prune
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SA_FILE: /tmp/sa.json
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/prune_gallery.py --dry-run
          else
            python scripts/prune_gallery.py
          fi

      - name: Commit pruned manifest
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thumbnails manifest.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Prune guest gallery [skip ci]"
            git push
          fi
