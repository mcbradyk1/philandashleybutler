<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Booth Sign</title>
  <link rel="icon" href="favicon.ico">
  <script src="config.js"></script>
  <script src="branding.js"></script>
  <link rel="stylesheet" href="shared.css">
  <!-- QR code generator (offline-friendly CDN; swap for a self-hosted copy if
       you prefer no third-party requests). Renders a QR to your site domain. -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    .sign { max-width: 640px; margin: 0 auto; text-align: center; }
    #qr { display: inline-block; margin: 24px auto; padding: 16px;
          background: #fff; border-radius: 16px;
          box-shadow: 0 4px 16px var(--accent-shadow); }
    .sign .domain { font-size: 20px; color: var(--accent); font-weight: 700; margin-top: 8px; }
    .sign .cta { font-size: 22px; color: var(--subtitle); font-family: var(--script-font); }
    .sign .blurb { color: var(--muted); font-style: italic; max-width: 460px; margin: 12px auto; }
    @media print { .home-link { display: none; } body { padding: 20px; } }
  </style>
</head>
<body>
  <a class="home-link" href="index.html">&lsaquo; Home</a>
  <div class="sign">
    <h1>
      <span class="couple" data-brand="eventName"></span>
      <span class="subtitle" data-brand="subtitle"></span>
    </h1>
    <div class="domain" data-brand="siteDomain"></div>
    <div class="cta">Scan to Share &amp; Browse</div>
    <div id="qr"></div>
    <p class="blurb">Upload your own photos, then browse the guest gallery.</p>
    <div style="letter-spacing:6px; color:var(--muted);">&middot; &middot; &middot;</div>
    <footer>
      <div data-brand="eventDateLine"></div>
      <div data-brand-html="footerHeart"></div>
    </footer>
  </div>

  <script>
    // Build the QR to https://<siteDomain> once config is available.
    (function () {
      var domain = (window.EVENT_CONFIG && window.EVENT_CONFIG.siteDomain) || location.host;
      var url = /^https?:\/\//.test(domain) ? domain : 'https://' + domain;
      new QRCode(document.getElementById('qr'), {
        text: url, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M
      });
    })();
  </script>
</body>
</html>
